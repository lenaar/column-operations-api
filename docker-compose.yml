version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      # Mount database file to persist data
      - ./data.db:/app/data.db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a test-only service
  test:
    build: .
    command: ["python", "run_tests.py"]
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=testing
