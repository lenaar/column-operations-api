swagger: "2.0"
info:
  title: "Column Operations API"
  version: "1.0.0"
  description: "Column Operations API v1 - Add columns and calculate formulas"

paths:
  /api/v1/data:
    get:
      tags:
        - Data
      summary: View all data in the database
      responses:
        200:
          description: Returns all data from the database
          schema:
            $ref: '#/definitions/DataResponse'

  /api/v1/data:sumColumns:
    post:
      tags:
        - Calculations
      summary: Add two columns row by row
      parameters:
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/SumColumnsRequest'
      responses:
        200:
          description: Returns the sum of two columns for each row
          schema:
            $ref: '#/definitions/SumColumnsResponse'
        400:
          description: Bad request - invalid column names or request format
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorResponse'


definitions:
  ErrorResponse:
    type: object
    properties:
      error:
        type: string
        example: "Invalid column name: column_11"

  SumColumnsRequest:
    type: object
    required:
      - the_first_col_name
      - my_second_colname
    properties:
      the_first_col_name:
        type: string
        example: "column_1"
      my_second_colname:
        type: string
        example: "column_5"

  SumColumnsResponse:
    type: object
    properties:
      result:
        type: array
        items:
          type: integer


  DataRow:
    type: object
    properties:
      id:
        type: integer
      column_1:
        type: integer
      column_2:
        type: integer
      column_3:
        type: integer
      column_4:
        type: integer
      column_5:
        type: integer
    # Note: This is generated from config/columns.py
    # To add/remove columns, update config/columns.py and regenerate this file

  DataResponse:
    type: object
    properties:
      data:
        type: array
        items:
          $ref: '#/definitions/DataRow'
      count:
        type: integer